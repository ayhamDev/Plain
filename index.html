<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="PlainUI. Thoughtfully minimal React components for your next idea. Explore the library, live examples, and a design system that feels like you."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PlainUI - A little less. A lot more.</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('plainui-theme') || '{}');
        var dark =
          p.mode === 'dark' ||
          ((!p.mode || p.mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = p.accent || 'neutral';
        document.documentElement.dataset.density = p.density || 'comfortable';
        if (typeof p.radius === 'number')
          document.documentElement.style.setProperty('--ui-radius', p.radius + 'px');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
